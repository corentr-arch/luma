name: Nettoyer stories expirées
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  nettoyer:
    runs-on: ubuntu-latest
    steps:
      - name: Appel Edge Function
        run: |
          curl -X POST \
            '${{ secrets.SUPABASE_URL }}/functions/v1/nettoyer-stories' \
            -H 'Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}' \
            -H 'Content-Type: application/json'