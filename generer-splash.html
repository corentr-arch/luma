<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Générer assets Luma</title>
  <style>
    body { background: #222; font-family: Arial, sans-serif; color: white; padding: 20px; }
    canvas { border: 1px solid #444; margin: 10px; }
    .row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
    .block { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    button {
      background: #2563EB; color: white; border: none;
      padding: 10px 20px; border-radius: 8px; cursor: pointer;
      font-size: 14px; margin-top: 6px;
    }
    button:hover { background: #1E40AF; }
    h2 { margin-bottom: 4px; font-size: 14px; color: #aaa; }
  </style>
</head>
<body>
  <h1 style="margin-bottom: 20px;">🎨 Générateur d'assets Luma</h1>
  <div class="row">
    <div class="block">
      <h2>Icône (1024×1024)</h2>
      <canvas id="icon" width="1024" height="1024" style="width:200px;height:200px;"></canvas>
      <button onclick="telecharger('icon', 'icon.png')">Télécharger icon.png</button>
      <button onclick="telecharger('icon', 'adaptive-icon.png')">Télécharger adaptive-icon.png</button>
    </div>
    <div class="block">
      <h2>Splash (1284×2778)</h2>
      <canvas id="splash" width="1284" height="2778" style="width:120px;height:260px;"></canvas>
      <button onclick="telecharger('splash', 'splash.png')">Télécharger splash.png</button>
    </div>
    <div class="block">
      <h2>Favicon (48×48)</h2>
      <canvas id="favicon" width="48" height="48" style="width:80px;height:80px;"></canvas>
      <button onclick="telecharger('favicon', 'favicon.png')">Télécharger favicon.png</button>
    </div>
  </div>

  <script>
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function dessinerLogo(ctx, cx, cy, taille) {
      // Cercle extérieur blanc
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx, cy, taille * 0.38, 0, Math.PI * 2);
      ctx.fill();

      // Cercle intérieur bleu
      ctx.fillStyle = '#2563EB';
      ctx.beginPath();
      ctx.arc(cx, cy, taille * 0.18, 0, Math.PI * 2);
      ctx.fill();

      // Pointe en bas
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(cx - taille * 0.14, cy + taille * 0.16);
      ctx.lineTo(cx + taille * 0.14, cy + taille * 0.16);
      ctx.lineTo(cx, cy + taille * 0.52);
      ctx.closePath();
      ctx.fill();

      // Recouvre le bas du cercle pour faire la forme pin
      ctx.fillStyle = '#2563EB';
      ctx.beginPath();
      ctx.arc(cx, cy, taille * 0.18, 0, Math.PI * 2);
      ctx.fill();
    }

    // ── ICÔNE 1024×1024 ──
    function dessinerIcone() {
      const canvas = document.getElementById('icon');
      const ctx = canvas.getContext('2d');
      const w = 1024, h = 1024;

      // Fond bleu avec coins arrondis
      ctx.fillStyle = '#2563EB';
      roundRect(ctx, 0, 0, w, h, 220);
      ctx.fill();

      // Logo blanc centré
      dessinerLogo(ctx, w/2, h/2 - 60, 320);

      // Texte "luma"
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 140px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('luma', w/2, h/2 + 280);
    }

    // ── SPLASH 1284×2778 ──
    function dessinerSplash() {
      const canvas = document.getElementById('splash');
      const ctx = canvas.getContext('2d');
      const w = 1284, h = 2778;
      const cx = w / 2;
      const cy = h / 2 - 80;

      // Fond noir
      ctx.fillStyle = '#111111';
      ctx.fillRect(0, 0, w, h);

      // Carré bleu arrondi
      const boxSize = 280;
      ctx.fillStyle = '#2563EB';
      roundRect(ctx, cx - boxSize/2, cy - boxSize/2 - 120, boxSize, boxSize, 70);
      ctx.fill();

      // Logo blanc dans le carré
      dessinerLogo(ctx, cx, cy - boxSize/2 - 120 + boxSize/2, 200);

      // Texte "luma"
      ctx.fillStyle = '#ffffff';
      ctx.font = '500 160px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('luma', cx, cy + 120);

      // Tagline
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.font = '50px Arial';
      ctx.fillText('rejoins ton quartier', cx, cy + 230);
    }

    // ── FAVICON 48×48 ──
    function dessinerFavicon() {
      const canvas = document.getElementById('favicon');
      const ctx = canvas.getContext('2d');
      const w = 48, h = 48;

      ctx.fillStyle = '#2563EB';
      roundRect(ctx, 0, 0, w, h, 10);
      ctx.fill();

      dessinerLogo(ctx, w/2, h/2 - 2, 28);
    }

    function telecharger(canvasId, nom) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = nom;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    dessinerIcone();
    dessinerSplash();
    dessinerFavicon();
  </script>
</body>
</html>
